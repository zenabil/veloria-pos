# Veloria PoS — CI (P3) : garde-fous AGENTS.md §8 sur chaque push/PR Windows.
# Note : E2E/packaging exigent machine Windows + clé vendor + élévation —
# le job E2E est manuel (workflow_dispatch) ; le job principal est 100 % local.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run typecheck:electron
      - run: npm run typecheck:manager
      - run: npm run license:scan
      - run: npm test
      - run: npm run verify:migrations
      - run: npm run verify:domain
      - run: npm run build
      - run: npm run build:electron
      - run: npm run build:manager-client
      - run: npm run build:manager
