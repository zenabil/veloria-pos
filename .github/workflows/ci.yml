# Veloria PoS — CI : garde-fous AGENTS.md §8 sur chaque push/PR Windows.
#
# E-57 (radical) — cette CI était rouge PAR CONSTRUCTION et n'a donc jamais
# rien garanti : `npm run check` appelle `typecheck:mobile` / `typecheck:owner`
# dont le `tsconfig` `extends: "expo/tsconfig.base"` exige `mobile/node_modules`
# et `owner/node_modules` — jamais installés par un `npm ci` racine (le dépôt
# n'est pas un workspace). Pire, `version:check` lisait
# `mobile/android/app/build.gradle`, 100 % gitignoré ⇒ `verify` plantait sur un
# `ENOENT` avec une stack Node nue. Démontré sur un `git archive HEAD` :
# les deux échecs étaient reproductibles, et l'absence de dépôt distant a
# caché le fait (299 commits sans un seul run CI).
#
# Les dépendances des deux apps Expo sont donc installées ICI, et la porte de
# version ne peut plus dépendre d'un fichier non versionné.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            owner/package-lock.json
      - run: npm ci --ignore-scripts
      # `better-sqlite3` a un `binding.gyp` → npm y lance `node-gyp rebuild` →
      # échec sur un runner sans Visual Studio. Son binaire N-API est DÉJÀ dans
      # le paquet (`prebuilds/win32-x64.node`, ADR-155) : on désactive les
      # scripts et on rejoue à la main celui d'Electron (binaire runtime).
      - run: node node_modules/electron/install.js
      - run: node node_modules/esbuild/install.js
      # Les deux apps Expo sont typecheckées par `npm run check` : sans leurs
      # dépendances, `expo/tsconfig.base` est introuvable et le job échoue
      # avant même de regarder le code.
      - run: npm ci
        working-directory: mobile
      - run: npm ci
        working-directory: owner
      - run: node -e "const Database=require('better-sqlite3');const db=new Database(':memory:');db.prepare('SELECT 1 AS x').get();db.close();console.log('OK better-sqlite3 N-API')"
      - run: npm run check
      - run: npm run knip
      - run: npm test
      - run: npm run test:coverage
      - run: npm run test:coverage:features
      # Ratchet de couverture de TOUTE la couche logique (electron/, shared/,
      # mobile/, owner/ inclus) : sans ce run, la porte « 51/50/44/53 » était
      # mesurable mais jamais exercée, donc un recul passait inaperçu.
      - run: npm run test:coverage:all
      - run: npm run verify
      - run: npm run build
      - run: npm run build:electron
      - run: npm run build:manager-client
      - run: npm run build:manager

  # Empaquetage réel (REL-03) : le runtime PACKAGÉ doit être vérifié, pas
  # seulement le build depuis les sources. Cible `portable` : elle n'exige ni
  # UAC ni installation, donc elle tourne dans un CI non interactif.
  # La porte `release:verify` REFUSE de publier un binaire non signé ou dont
  # l'empreinte ne correspond pas au manifeste (REL-01/REL-02) — sauf pour un
  # build de TEST interne, explicitement signalé par VELORIA_ALLOW_UNSIGNED.
  packaging:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VELORIA_ALLOW_UNSIGNED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Empaquetage portable (POS)
        shell: pwsh
        run: |
          $env:VELORIA_ALLOW_UNSIGNED = "1"
          # Variante CI : pas de clé privée vendor sur un runner ⇒ manifeste
          # d'intégrité re-signé en mode opportuniste (`--if-key-present`)
          # au lieu d'échouer en mode strict.
          npm run package:portable:ci
      - name: Empreinte + trace de build
        shell: pwsh
        run: |
          # La trace de build doit être présente ET horodatée par ce build.
          $info = Get-Content "release\win-unpacked\resources\build-info.json" | ConvertFrom-Json
          if (-not $info.commit -or $info.commit.Length -lt 7) {
            Write-Error "build-info.json sans révision source exploitable"
            exit 1
          }
          Write-Output "OK  build-info : version=$($info.version) commit=$($info.commit)"
      - name: Artefacts
        uses: actions/upload-artifact@v4
        with:
          name: veloria-pos-portable
          path: |
            release/Veloria-PoS-Portable-*.exe
            release/*.sha256
            release/SHA256SUMS.txt
          if-no-files-found: error

  # E2E sur l'application RÉELLE (Electron + base isolée). Les scénarios de
  # licence exigent la clé privée vendor : sans le secret, `skipIfNoVendorKey`
  # saute ces specs — le job reste vert mais le journal le dit. Volontairement
  # SANS `continue-on-error` : un échec de caisse doit casser la CI.
  e2e:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VELORIA_VENDOR_PRIVATE_KEY_B64: ${{ secrets.VELORIA_VENDOR_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run build:electron
      - name: Matériel de licence vendor (optionnel)
        shell: pwsh
        run: |
          if ($env:VELORIA_VENDOR_PRIVATE_KEY_B64) {
            New-Item -ItemType Directory -Force -Path private/vendor-keys | Out-Null
            [IO.File]::WriteAllBytes("private/vendor-keys/private.key", [Convert]::FromBase64String($env:VELORIA_VENDOR_PRIVATE_KEY_B64))
            Write-Output "OK  clé vendor restaurée : les specs de licence seront exécutées"
          } else {
            Write-Output "WARN  secret VELORIA_VENDOR_PRIVATE_KEY_B64 absent : les specs qui émettent une licence se sauteront d'elles-mêmes."
          }
      # `tests/e2e/full-loop-client` pilote le miroir par un relais de
      # boucle (:8100) — sans lui l'échec ne dirait RIEN du code de synchro.
      - name: Relais de miroir (boucle :8100)
        shell: pwsh
        run: Start-Process -FilePath "node" -ArgumentList "scripts/e2e-mirror-relay.mjs" -WindowStyle Hidden
      - run: npm run test:e2e
