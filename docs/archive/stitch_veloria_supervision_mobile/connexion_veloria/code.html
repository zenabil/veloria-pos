<!DOCTYPE html>

<html lang="fr"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"on-primary-container":"#778599","on-primary-fixed-variant":"#3a485a","surface-container-highest":"#e1e2e4","background":"#f8f9fb","error-container":"#ffdad6","primary-fixed-dim":"#b9c8de","on-primary":"#ffffff","surface-dim":"#d9dadc","on-secondary-fixed-variant":"#5c4300","inverse-primary":"#b9c8de","tertiary-container":"#2c1607","primary-fixed":"#d5e4fa","secondary-fixed-dim":"#f9bd22","secondary":"#795900","outline-variant":"#c4c6cd","on-surface-variant":"#44474c","on-secondary":"#ffffff","on-secondary-fixed":"#261a00","tertiary-fixed-dim":"#e7bea5","inverse-on-surface":"#f0f1f3","on-primary-fixed":"#0e1c2d","on-tertiary-fixed-variant":"#5d402d","outline":"#74777d","surface":"#f8f9fb","on-error":"#ffffff","error":"#ba1a1a","on-tertiary-fixed":"#2c1607","primary-container":"#0e1c2d","surface-container":"#edeef0","secondary-fixed":"#ffdf9f","secondary-container":"#ffc329","inverse-surface":"#2e3132","surface-tint":"#515f72","surface-variant":"#e1e2e4","on-secondary-container":"#6f5100","primary":"#000000","on-error-container":"#93000a","surface-bright":"#f8f9fb","on-background":"#191c1e","on-tertiary-container":"#a07c66","on-tertiary":"#ffffff","surface-container-lowest":"#ffffff","on-surface":"#191c1e","surface-container-high":"#e7e8ea","surface-container-low":"#f2f4f6","tertiary-fixed":"#ffdcc7","tertiary":"#000000"},borderRadius:{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},spacing:{"margin":"1rem","space-lg":"1rem","space-sm":"0.5rem","space-md":"0.75rem","space-xs":"0.25rem","space-xl":"1.5rem","gutter":"0.75rem"},fontFamily:{"label-badge":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"label-timestamp":["Plus Jakarta Sans"],"body-sm":["Plus Jakarta Sans"],"currency-md":["Plus Jakarta Sans"],"currency-hero":["Plus Jakarta Sans"],"headline-hero":["Plus Jakarta Sans"],"headline-lg":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"headline-sm":["Plus Jakarta Sans"]},fontSize:{"label-badge":["11px",{"lineHeight":"14px","letterSpacing":"0.02em","fontWeight":"600"}],"headline-md":["18px",{"lineHeight":"24px","fontWeight":"700"}],"label-timestamp":["12px",{"lineHeight":"16px","fontWeight":"500"}],"body-sm":["13px",{"lineHeight":"18px","fontWeight":"500"}],"currency-md":["18px",{"lineHeight":"24px","letterSpacing":"-0.01em","fontWeight":"700"}],"currency-hero":["28px",{"lineHeight":"32px","letterSpacing":"-0.02em","fontWeight":"800"}],"headline-hero":["30px",{"lineHeight":"36px","letterSpacing":"-0.02em","fontWeight":"800"}],"headline-lg":["22px",{"lineHeight":"28px","letterSpacing":"-0.01em","fontWeight":"700"}],"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"headline-sm":["16px",{"lineHeight":"22px","fontWeight":"600"}]}}}};</script></head><body class="bg-primary-container font-body-md text-body-md text-on-primary pt-safe pb-safe flex flex-col min-h-screen antialiased"><main class="flex flex-col relative w-full bg-primary-container min-h-screen px-margin"><div class="flex flex-col w-full text-on-primary">
<div class="flex flex-col items-center justify-between w-full py-space-xl px-space-xs">
<!-- Top Identity Branding -->
<div class="flex flex-col items-center text-center mt-space-md mb-space-xl">
<div class="relative w-16 h-16 mb-space-lg flex items-center justify-center rounded-2xl bg-primary-container">
<img alt="Monogramme Veloria" class="w-16 h-16 object-contain rounded-2xl" src="https://lh3.googleusercontent.com/aida/AEtjO1UuD6shjeRg1yAKyiCwIgyQCwaMzzxrIak7aoZoN_XEs8JluDEytyodMOPp2OyoXXgj9_W985nJabDC-WlrwYkYDkBN1XugXppZvQHkSzB4YVUJqttASexW1rzAqQH7qQZoD2bn4nc5zgbcerGRIqmKRKtVsSm7u0sa-xgvlxPCWBUhyKvvfeOyoHJGffw4z09vvOXc8A5jxUf-Y-CYZmkk1qPJXBdtfr0WVxKttPKEkA"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-primary tracking-tight mb-space-xs">
        Espace propriétaire
      </h1>
<p class="font-body-md text-body-md text-on-primary-container">
        Veloria — supervision du magasin
      </p>
</div>
<!-- Credential Form Block -->
<div class="w-full flex flex-col gap-space-lg mb-space-xl">
<!-- Input Group: Email -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-badge text-label-badge text-on-primary-container uppercase tracking-wider" for="owner-email">
          Adresse e-mail
        </label>
<div class="relative w-full flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-primary-container select-none text-[20px]">
            alternate_email
          </span>
<input class="w-full h-12 pl-12 pr-4 rounded-[14px] bg-tertiary-container text-on-primary font-body-md text-body-md focus:outline-none transition-colors" id="owner-email" readonly="" type="email" value="direction@veloria-boutique.dz"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-badge text-label-badge text-on-primary-container uppercase tracking-wider" for="owner-password">
          Mot de passe
        </label>
<div class="relative w-full flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-primary-container select-none text-[20px]">
            lock
          </span>
<input class="w-full h-12 pl-12 pr-12 rounded-[14px] bg-tertiary-container text-on-primary placeholder:text-on-primary-container font-body-md text-body-md focus:outline-none transition-colors" id="owner-password" placeholder="••••••••••••" type="password" value="supersecretpwd"/>
<button aria-label="Afficher le mot de passe" class="absolute right-3 w-8 h-8 flex items-center justify-center text-on-primary-container hover:text-on-primary active:scale-95 transition-all" id="toggle-pwd-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<!-- Educational Context Alert -->
<div class="flex items-center gap-space-sm px-space-md py-space-sm rounded-[10px] bg-error-container text-on-error-container">
<span class="material-symbols-outlined text-[18px] text-error flex-shrink-0">
          info
        </span>
<span class="font-label-timestamp text-label-timestamp text-error">
          Session expirée. Veuillez vous réauthentifier.
        </span>
</div>
<!-- Primary Action Button -->
<button class="w-full h-[50px] mt-space-xs rounded-[14px] bg-secondary-fixed-dim text-on-secondary-fixed font-headline-sm text-headline-sm flex items-center justify-center gap-space-sm active:opacity-90 active:scale-[0.99] transition-all" id="login-btn" type="button">
<span>Se connecter</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Center Recovery Link -->
<div class="flex justify-center mt-space-xs">
<a class="font-body-sm text-body-sm text-on-primary-container hover:underline active:opacity-75 transition-opacity" href="#forgot">
          Mot de passe oublié ?
        </a>
</div>
</div>
<!-- Biometric Fallback & Security Disclaimer -->
<div class="w-full flex flex-col items-center gap-space-lg">
<!-- Biometric Ghost Button -->
<button class="w-full h-12 rounded-[14px] bg-tertiary-container text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-space-sm active:bg-surface-tint active:scale-[0.99] transition-all" id="bio-btn" type="button">
<span class="material-symbols-outlined text-secondary-fixed-dim text-[22px]">
          fingerprint
        </span>
<span>Déverrouillage biométrique</span>
</button>
<!-- Bottom Compliance Disclaimer -->
<div class="flex items-center justify-center gap-space-xs text-center px-space-sm pt-space-xs">
<span class="material-symbols-outlined text-[14px] text-on-primary-container">
          verified_user
        </span>
<span class="font-label-badge text-label-badge text-on-primary-container font-normal">
          Mode consultation sécurisée — Accès réservé à la gérance
        </span>
</div>
</div>
</div>
<script>
    (function() {
      const pwdInput = document.getElementById('owner-password');
      const toggleBtn = document.getElementById('toggle-pwd-btn');
      const pwdIcon = document.getElementById('pwd-icon');

      if (toggleBtn && pwdInput && pwdIcon) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = pwdInput.getAttribute('type') === 'password';
          pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
          pwdIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });
      }

      const bioBtn = document.getElementById('bio-btn');
      if (bioBtn) {
        bioBtn.addEventListener('click', function() {
          bioBtn.classList.add('opacity-70');
          setTimeout(() => bioBtn.classList.remove('opacity-70'), 300);
        });
      }
    })();
  </script>
</div></main></body></html>
