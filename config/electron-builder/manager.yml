appId: com.veloria.license-manager
productName: Veloria License Manager
copyright: Copyright © Veloria
directories:
  output: release
  buildResources: public
extraMetadata:
  main: dist-license-manager/license-manager/main/main.js
files:
  - dist-license-manager/**/*
  - dist-license-manager-renderer/**/*
  - package.json
  - node_modules/better-sqlite3/**/*
  - "!node_modules/pdfjs-dist/**/*"
  - "!node_modules/tesseract.js*/**/*"
# P10: clé publique de vérification du manifeste manager (comme le POS).
extraResources:
  - from: resources/license
    to: license
  # Icône de fenêtre (BrowserWindow) : `public/` n'est PAS empaqueté dans
  # l'asar, donc exposée via resourcesPath (résolue dans window-manager).
  - from: public/icons
    to: icons
  # Trace de build (REL-04) : version + révision source, comme le POS.
  - from: scripts/release/build-info.json
    to: build-info.json
asar: true
# better-sqlite3 13 est N-API : binaire précompilé compatible Electron,
# aucune recompilation requise (ADR-155).
npmRebuild: false
asarUnpack:
  - "**/*.node"
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: public/icons/manager-icon.ico
  # REVERTI (ADR-070, 2026-10-06) : idem electron-builder.yml — true obligatoire,
  # builds release avec privilège symlink (interdit d'expédier à false).
  signAndEditExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Machine (tous utilisateurs) comme le POS : défaut
  # `C:\Program Files\Veloria License Manager`, modifiable, élévation UAC.
  # (Même note de migration HKCU→HKLM que le POS : désinstaller l'ancien.)
  perMachine: true
  installerLanguages: fr_FR
  installerIcon: public/icons/manager-icon.ico
  uninstallerIcon: public/icons/manager-icon.ico
  createDesktopShortcut: false
  createStartMenuShortcut: true
  menuCategory: Veloria
  shortcutName: Veloria License Manager
  uninstallDisplayName: Veloria License Manager
  deleteAppDataOnUninstall: false
  warningsAsErrors: false
portable:
  artifactName: Veloria-License-Manager-Portable-${version}.exe
artifactName: Veloria-License-Manager-Setup-${version}.${ext}
publish: []
