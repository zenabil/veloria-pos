<section class="section section-defer">
  <div class="wrap">
    <div class="receipt-cta" data-reveal>
      <p class="kicker">{{cta.kicker}}</p>
      <h2>{{cta.title}}</h2>
      <p class="lead" style="color: #3c465c; margin-inline: 0">{{cta.text}}</p>
      <div class="cta-row">
        <a class="btn btn-primary" href="{{cta.primaryHref}}">{{cta.primaryLabel}}</a>
        <a class="btn btn-glass" href="{{cta.secondaryHref}}">{{cta.secondaryLabel}}</a>
      </div>
      <p class="receipt-line">{{cta.foot}}</p>
    </div>
  </div>
</section>
